<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目路线图</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><span class="logo" id="logo">P</span><span id="brand-name">项目路线图</span><span class="brand-sub">PROJECT FOCUS</span></div><nav><button class="active" data-view="map">战略路线</button><button data-view="acceptance">验收清单</button><button data-view="activity">开发记录</button></nav><div id="sync" role="status">正在同步…</div></header>
<aside class="sidebar"><div class="project-icon" id="project-icon">P</div><h3 id="project-name">项目</h3><p id="project-context">本地项目工作台</p><div class="side-label">项目空间</div><button class="side-link active" data-view="map">⌘　开发路线图</button><button class="side-link" data-view="acceptance">☷　正式验收</button><button class="side-link" data-view="activity">◷　开发记录</button><div class="side-label">项目文档</div><div id="documents"></div><div class="side-bottom"><span class="dot green"></span> 本地项目工作台<p id="version-label">内部开发</p></div></aside>
<main><section class="heading"><div><div class="eyebrow" id="eyebrow"></div><h1 id="page-title">每一步，都有通往下一步的条件。</h1></div><button id="export">导出状态 ↗</button></section><section class="stats" id="stats"></section><div class="workspace"><section id="map-view"><div class="map-toolbar"><div><strong>开发路线</strong><span class="quiet">　实线：全部前置满足后解锁 · 虚线：未来候选</span></div><input id="search" placeholder="搜索节点、需求或验收编号" aria-label="搜索节点"></div><div id="viewport"><div id="scene"><svg id="edges" aria-label="项目节点依赖关系"></svg><div id="stages"></div><div id="nodes"></div></div></div><div class="map-footer"><div class="zoom"><button id="minus" aria-label="缩小">−</button><span id="scale">100%</span><button id="plus" aria-label="放大">＋</button><button id="fit">适应画布</button></div><div class="legend"><span><i class="dot green"></i>已完成</span><span><i class="dot blue"></i>进行中</span><span><i class="dot gray"></i>待解锁</span><span><i class="dot red"></i>受阻</span><span><i class="dot purple"></i>未来路线</span></div></div></section><section id="acceptance-view" hidden></section><section id="activity-view" hidden></section><aside id="detail"></aside></div></main><script src="/app.js" type="module"></script></body></html>
